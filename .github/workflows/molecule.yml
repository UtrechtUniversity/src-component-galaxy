---
name: Molecule tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  molecule:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_RESULT_FORMAT: yaml
      ANSIBLE_FORCE_COLOR: '0' # ANSI coloring breaks GitHub's ability to mask GH secrets in logs.      ANSIBLE_RESULT_FORMAT: yaml
      REQUIREMENTS_FILE: molecule/requirements.txt
      BOOTSTRAP_KEY: foobar  # defines an api bootstrap key for the molecule tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r ${{ env.REQUIREMENTS_FILE }}
      - name: Molecule tests
        run: |
          BOOTSTRAP_KEY=${{ env.BOOTSTRAP_KEY }} molecule -vvv test --all
